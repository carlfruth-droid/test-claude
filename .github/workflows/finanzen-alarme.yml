name: Finanzzentrale – Alarme prüfen

# Prüft Kurslimits, Wiedervorlagen und Termine der Finanzzentrale und schickt
# fällige Meldungen per E-Mail und Push. Zeitgesteuerte Abläufe laufen bei
# GitHub nur auf dem Standard-Branch.
on:
  schedule:
    - cron: '7,37 6-21 * * 1-5'   # werktags etwa alle 30 Minuten (8–23 Uhr deutscher Sommerzeit)
    - cron: '17 7 * * 0,6'        # am Wochenende einmal morgens (Wiedervorlagen, Termine)
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Alarme und Erinnerungen prüfen
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TOKEN=$(printf '%s' "finanzzentrale-cron:$FTP_PASSWORD" | sha256sum | cut -c1-40)
          echo "::add-mask::$TOKEN"
          curl -fsS -m 170 "https://fruthzeug.de/projekte/finanzen/?cron=$TOKEN" -o antwort.json
          python3 -c "import json; d = json.load(open('antwort.json')); print('ok' if d.get('ok') else 'Fehler', '– geprüft:', d.get('geprueft'), '– ausgelöst:', d.get('ausgeloest'))"
