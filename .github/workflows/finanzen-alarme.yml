name: Finanzzentrale – Alarme prüfen

# Prüft Kurslimits, Wiedervorlagen und Termine der Finanzzentrale und schickt
# fällige Meldungen per E-Mail und Push. Zeitgesteuerte Abläufe laufen bei
# GitHub nur auf dem Standard-Branch.
on:
  schedule:
    - cron: '7,37 6-21 * * 1-5'   # werktags etwa alle 30 Minuten (8–23 Uhr deutscher Sommerzeit)
    - cron: '17 7 * * 0,6'        # am Wochenende einmal morgens (Wiedervorlagen, Termine)
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Alarme und Erinnerungen prüfen
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TOKEN=$(printf '%s' "finanzzentrale-cron:$FTP_PASSWORD" | sha256sum | cut -c1-40)
          echo "::add-mask::$TOKEN"
          curl -fsS -m 170 "https://fruthzeug.de/projekte/finanzen/?cron=$TOKEN" -o antwort.json
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(open('antwort.json'))
          print('ok' if d.get('ok') else 'Fehler', '– geprüft:', d.get('geprueft'), '– ausgelöst:', d.get('ausgeloest'))
          # Push-Meldungen, die ntfy vom Webhosting nicht angenommen hat (Drosselung), von hier aus schicken
          gesendet = 0
          for p in d.get('ntfy') or []:
              try:
                  req = urllib.request.Request(p['server'].rstrip('/') + '/', data=json.dumps(p['nachricht']).encode(), headers={'Content-Type': 'application/json'})
                  urllib.request.urlopen(req, timeout=15)
                  gesendet += 1
              except Exception as e:
                  print('Push nicht zugestellt:', type(e).__name__)
          print('Push nachgeschickt:', gesendet)
          PY
